# Devcontainer override: adds the `dev` workspace container to the root stack and reuses its `db` service,
# so there is exactly one PostGIS definition (host port 5433 -> 5432).
services:
  db:
    # `devcontainer up` runs `docker compose build/up dev db` without --profile live; drop the profile for this stack.
    profiles: !reset []
  dev:
    build:
      context: .devcontainer
    init: true
    command: sleep infinity
    volumes:
      # Relative paths resolve against the project directory (the root compose file's folder), not this file.
      - .:/workspaces/Rurotation:cached
      - cropshift-playwright-cache:/home/vscode/.cache/ms-playwright
      # Dependencies live in named volumes: the host's node_modules/.venv are built for another OS/Python.
      - cropshift-web-node-modules:/workspaces/Rurotation/web/node_modules
      - cropshift-landing-node-modules:/workspaces/Rurotation/landing/node_modules
      - cropshift-backend-venv:/workspaces/Rurotation/backend/.venv
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      API_MODE: mock
      API_ORIGIN: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONPATH: /workspaces/Rurotation/backend:/workspaces/Rurotation
    depends_on:
      db:
        condition: service_healthy

volumes:
  cropshift-playwright-cache:
  cropshift-web-node-modules:
  cropshift-landing-node-modules:
  cropshift-backend-venv:
