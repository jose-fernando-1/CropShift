# Cropshift: local/production stack.
#   docker compose up --build web          -> http://localhost:3000 (mock API)
# To use the real backend, uncomment `api`, set API_MODE=live on `web`.
services:
  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_MODE: ${API_MODE:-mock}
      API_ORIGIN: ${API_ORIGIN:-}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-15000}
      SHOW_DATA_FLOW: ${SHOW_DATA_FLOW:-true}
    restart: unless-stopped

